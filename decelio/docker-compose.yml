services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: decelio
      POSTGRES_PASSWORD: decelio
      POSTGRES_DB: decelio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decelio -d decelio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
