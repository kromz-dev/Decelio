version: 2
updates:
  - package-ecosystem: npm
    directory: /decelio
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      vitest:
        # Regroupe vitest et ses paquets @vitest/* : coverage-v8 exige la
        # meme version majeure que vitest en dependance homologue stricte,
        # une montee separee de l'un des deux fait echouer npm ci.
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # eslint 10 : eslint-plugin-react, embarque par eslint-config-next
      # 16.3.6, n'accepte pas encore ESLint 10. A lever quand
      # eslint-config-next publiera une version compatible.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript 7 : typescript-eslint ne prend pas encore en charge
      # TypeScript 7. A lever quand typescript-eslint publiera une
      # version compatible.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Prisma 7 : migration a part entiere (schema, client, moteur de
      # requetes), a traiter dans sa propre branche dediee plutot que
      # via une mise a jour automatique. A lever quand cette migration
      # sera planifiee.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # undici majeur : le dispatcher épinglé (lib/scanner/crawler.ts,
      # createPinnedDispatcher) doit rester compatible avec l'undici embarqué
      # dans le fetch global de Node (branche 7.x sur Node 22 comme sur
      # Node 24). La demande #174 est passée en undici 8 sans que rien ne
      # le détecte (les tests simulent fetch) et a cassé toute requête
      # sortante du scanner : `fetch` refuse un dispatcher venant d'un undici
      # majeur different du sien, avec `UND_ERR_INVALID_ARG`. A lever
      # seulement quand Node embarquera undici 8, ou quand le scanner
      # utilisera le fetch du paquet undici au lieu du fetch global.
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # docker-compose (et non docker) : /decelio ne contient pas de Dockerfile,
  # seulement docker-compose.yml pour la base PostgreSQL locale. L'écosystème
  # « docker » échouait chaque semaine (« No Dockerfiles nor Kubernetes YAML »).
  - package-ecosystem: docker-compose
    directory: /decelio
    schedule:
      interval: weekly
    ignore:
      # postgres 18 : on reste sur la même version majeure que Neon en
      # production (PostgreSQL 17). A lever quand Neon passera en 18.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
