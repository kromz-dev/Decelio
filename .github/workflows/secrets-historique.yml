# Scan complet de l'historique git a la recherche de secrets.
#
# Pourquoi workflow_dispatch UNIQUEMENT (pas de push/pull_request/schedule) :
# - Budget 0 EUR (fondateur solo) : docs/10-plan-technique.md et ENF-015
#   interdisent tout job recurrent de confort ("aucune intervention manuelle
#   recurrente" / "aucun job recurrent de confort sur Inngest", meme logique
#   appliquee ici a la CI). Ce flux ne consomme des minutes GitHub Actions
#   que le jour ou quelqu'un le declenche a la main.
# - Le job "security" de .github/workflows/ci.yml scanne deja chaque pull
#   request via gitleaks --log-opts sur la seule plage de la demande. Ce
#   flux-ci couvre l'angle mort : l'historique complet, en profondeur, a la
#   demande (audit ponctuel, doute apres un incident, verification avant une
#   etape sensible).
name: Scan complet de l'historique (secrets)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-historique-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-historique:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperer le code (historique complet)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # sans l'historique complet, ce scan ne vaut rien

      # gitleaks detect/protect sont deprecies depuis la v8.19.0 au profit de
      # "gitleaks git", qui scanne tout l'historique via `git log -p` par
      # defaut (aucune plage n'est passee ici, donc aucun --log-opts).
      # Version epinglee sur 8.24.3 pour matcher exactement le job "security"
      # de ci.yml et obtenir le meme verdict. Image officielle Docker Hub :
      # elle embarque git, donc pas besoin d'installer quoi que ce soit.
      # Compte personnel (pas une organisation) : aucune licence gitleaks
      # requise, donc aucune variable GITLEAKS_LICENSE.
      - name: Scanner tout l'historique avec gitleaks (image officielle v8.24.3)
        id: gitleaks
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            git --redact --exit-code 1 . | tee gitleaks-historique.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publier le resume et faire echouer si une fuite est trouvee
        if: always()
        shell: bash
        run: |
          STATUS="${{ steps.gitleaks.outputs.status }}"
          COMMITS=$(grep -oE '[0-9]+ commits scanned' gitleaks-historique.log || echo "inconnu (message absent du journal gitleaks)")

          {
            echo "## Scan complet de l'historique (gitleaks v8.24.3)"
            echo ""
            echo "- Commits couverts : $COMMITS"
            if [ "$STATUS" = "0" ]; then
              echo "- Verdict : ✅ aucune fuite detectee sur l'historique entier"
            else
              echo "- Verdict : ❌ fuite(s) detectee(s) — voir le journal de l'etape precedente (valeurs redigees par --redact)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != "0" ]; then
            exit 1
          fi
